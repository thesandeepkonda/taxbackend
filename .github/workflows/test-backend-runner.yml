name: Tax Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: tax-backend-production
  cancel-in-progress: false

jobs:

  build-and-deploy:

    runs-on:
      - self-hosted
      - Windows
      - X64
      - taxbackend

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA CHECK
      # ============================================================

      - name: Verify Java
        shell: powershell
        run: |
          Write-Host "Checking Java..."
          java -version

          if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: Java is not available."
              exit 1
          }


      # ============================================================
      # 3. MAVEN WRAPPER CHECK
      # ============================================================

      - name: Verify Maven Wrapper
        shell: powershell
        run: |

          $mvn = Join-Path $env:GITHUB_WORKSPACE "mvnw.cmd"

          Write-Host "Maven wrapper:"
          Write-Host $mvn

          if (!(Test-Path $mvn)) {
              Write-Host "ERROR: mvnw.cmd not found."
              exit 1
          }

          Write-Host "mvnw.cmd found."


      # ============================================================
      # 4. CLEAN OLD BUILD
      # ============================================================

      - name: Clean previous build
        shell: powershell
        run: |

          $target = Join-Path $env:GITHUB_WORKSPACE "target"

          if (Test-Path $target) {

              Write-Host "Removing old target directory..."

              Remove-Item `
                $target `
                -Recurse `
                -Force `
                -ErrorAction Stop
          }

          Write-Host "Clean build directory ready."


      # ============================================================
      # 5. BUILD
      # ============================================================

      - name: Build application
        shell: powershell
        run: |

          Set-Location $env:GITHUB_WORKSPACE

          Write-Host "Building application..."

          .\mvnw.cmd clean package -DskipTests

          if ($LASTEXITCODE -ne 0) {
              Write-Host "ERROR: Maven build failed."
              exit 1
          }

          Write-Host "BUILD SUCCESSFUL."


      # ============================================================
      # 6. FIND EXACT CURRENT BUILD JAR
      # ============================================================

      - name: Locate new JAR
        shell: powershell
        run: |

          $target = Join-Path $env:GITHUB_WORKSPACE "target"

          $jars = Get-ChildItem `
            $target `
            -Filter "*.jar" `
            -File

          if ($jars.Count -eq 0) {

              Write-Host "ERROR: No JAR found."
              exit 1
          }

          if ($jars.Count -gt 1) {

              Write-Host "ERROR: Multiple JAR files found:"

              $jars | ForEach-Object {
                  Write-Host $_.FullName
              }

              exit 1
          }

          $jar = $jars[0]

          Write-Host "NEW BUILD JAR:"
          Write-Host "Path : $($jar.FullName)"
          Write-Host "Size : $($jar.Length)"
          Write-Host "Time : $($jar.LastWriteTime)"

          "NEW_JAR=$($jar.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      # ============================================================
      # 7. CALCULATE NEW JAR HASH
      # ============================================================

      - name: Calculate build checksum
        shell: powershell
        run: |

          $hash = Get-FileHash `
            "$env:NEW_JAR" `
            -Algorithm SHA256

          Write-Host "======================================"
          Write-Host "NEW BUILD SHA256"
          Write-Host "======================================"

          Write-Host $hash.Hash

          "NEW_JAR_HASH=$($hash.Hash)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8


      # ============================================================
      # 8. VERIFY BUILD JAR
      # ============================================================

      - name: Validate build artifact
        shell: powershell
        run: |

          if (!(Test-Path "$env:NEW_JAR")) {

              Write-Host "ERROR: Build JAR does not exist."
              exit 1
          }

          $jar = Get-Item "$env:NEW_JAR"

          if ($jar.Length -lt 1MB) {

              Write-Host "ERROR: JAR size looks invalid."
              Write-Host "Size: $($jar.Length)"
              exit 1
          }

          Write-Host "Artifact validation successful."
          Write-Host "JAR: $($jar.FullName)"
          Write-Host "Size: $($jar.Length)"


      # ============================================================
      # 9. CREATE BACKUP DIRECTORY
      # ============================================================

      - name: Prepare backup directory
        shell: powershell
        run: |

          $backupDir = "C:\TaxBackend\backup"

          if (!(Test-Path $backupDir)) {

              New-Item `
                -ItemType Directory `
                -Path $backupDir `
                -Force | Out-Null
          }

          Write-Host "Backup directory ready."


      # ============================================================
      # 10. BACKUP CURRENT PRODUCTION JAR
      # ============================================================

      - name: Backup current production JAR
        shell: powershell
        run: |

          $productionJar = "C:\TaxBackend\app\matrix.jar"
          $backupDir = "C:\TaxBackend\backup"

          if (!(Test-Path $productionJar)) {

              Write-Host "WARNING: No existing production JAR."
              Write-Host "This appears to be the first deployment."

              "BACKUP_CREATED=false" | Out-File `
                -FilePath $env:GITHUB_ENV `
                -Encoding utf8

              exit 0
          }

          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"

          $backupJar = Join-Path `
            $backupDir `
            "matrix_$timestamp.jar"

          Copy-Item `
            $productionJar `
            $backupJar `
            -Force `
            -ErrorAction Stop

          if (!(Test-Path $backupJar)) {

              Write-Host "ERROR: Backup creation failed."
              exit 1
          }

          Write-Host "Backup created:"
          Write-Host $backupJar

          "BACKUP_JAR=$backupJar" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

          "BACKUP_CREATED=true" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8


      # ============================================================
      # 11. STOP SERVICE
      # ============================================================

      - name: Stop Tax Backend Service
        shell: powershell
        run: |

          Write-Host "Stopping TaxBackendService..."

          Stop-Service `
            -Name "TaxBackendService" `
            -Force `
            -ErrorAction Stop

          Start-Sleep -Seconds 5

          $service = Get-Service "TaxBackendService"

          if ($service.Status -ne "Stopped") {

              Write-Host "ERROR: Service did not stop."
              exit 1
          }

          Write-Host "Service stopped."


      # ============================================================
      # 12. VERIFY JAVA PROCESS IS GONE
      # ============================================================

      - name: Verify old backend process stopped
        shell: powershell
        run: |

          Start-Sleep -Seconds 3

          $port = Get-NetTCPConnection `
            -LocalPort 8080 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($port) {

              Write-Host "ERROR: Port 8080 is still in use."

              $port | Format-Table

              exit 1
          }

          Write-Host "Port 8080 is free."


      # ============================================================
      # 13. DEPLOY CURRENT BUILD
      # ============================================================

      - name: Deploy new JAR
        shell: powershell
        run: |

          $productionJar = "C:\TaxBackend\app\matrix.jar"

          Write-Host "======================================"
          Write-Host "DEPLOYING NEW BUILD"
          Write-Host "======================================"

          Write-Host "Source:"
          Write-Host "$env:NEW_JAR"

          Write-Host "Destination:"
          Write-Host "$productionJar"

          Copy-Item `
            "$env:NEW_JAR" `
            "$productionJar" `
            -Force `
            -ErrorAction Stop

          Write-Host "JAR copied successfully."


      # ============================================================
      # 14. VERIFY DEPLOYED JAR HASH
      # ============================================================

      - name: Verify deployed JAR
        shell: powershell
        run: |

          $productionJar = "C:\TaxBackend\app\matrix.jar"

          if (!(Test-Path $productionJar)) {

              Write-Host "ERROR: Production JAR does not exist."
              exit 1
          }

          $productionHash = (
              Get-FileHash `
                $productionJar `
                -Algorithm SHA256
          ).Hash

          Write-Host "======================================"
          Write-Host "HASH VERIFICATION"
          Write-Host "======================================"

          Write-Host "Build hash:"
          Write-Host "$env:NEW_JAR_HASH"

          Write-Host "Production hash:"
          Write-Host "$productionHash"

          if ($productionHash -ne $env:NEW_JAR_HASH) {

              Write-Host "ERROR: HASH MISMATCH!"
              Write-Host "Deployment artifact was not copied correctly."

              exit 1
          }

          Write-Host "HASH MATCH."
          Write-Host "Deployment artifact verified."


      # ============================================================
      # 15. START SERVICE
      # ============================================================

      - name: Start Tax Backend Service
        shell: powershell
        run: |

          Write-Host "Starting TaxBackendService..."

          Start-Service `
            -Name "TaxBackendService" `
            -ErrorAction Stop

          Start-Sleep -Seconds 5

          $service = Get-Service "TaxBackendService"

          Write-Host "Service status:"
          Write-Host $service.Status

          if ($service.Status -ne "Running") {

              Write-Host "ERROR: Service failed to start."
              exit 1
          }


      # ============================================================
      # 16. WAIT FOR NEW VERSION
      # ============================================================

      - name: Wait for backend startup
        shell: powershell
        run: |

          $healthUrl = "http://127.0.0.1:8080/actuator/health"

          $healthy = $false

          for ($i = 1; $i -le 18; $i++) {

              Write-Host ""
              Write-Host "Health check attempt $i/18..."

              try {

                  $response = Invoke-WebRequest `
                    -Uri $healthUrl `
                    -UseBasicParsing `
                    -TimeoutSec 5 `
                    -ErrorAction Stop

                  Write-Host "HTTP Status: $($response.StatusCode)"
                  Write-Host "Response: $($response.Content)"

                  if ($response.StatusCode -eq 200) {

                      try {

                          $health = $response.Content |
                            ConvertFrom-Json

                          Write-Host "Application status: $($health.status)"

                          if ($health.status -eq "UP") {

                              $healthy = $true
                              break
                          }

                      } catch {

                          Write-Host "Could not parse health response."
                      }
                  }

              } catch {

                  Write-Host "Backend not ready yet."
                  Write-Host $_.Exception.Message
              }

              Start-Sleep -Seconds 5
          }

          if (!$healthy) {

              Write-Host ""
              Write-Host "======================================"
              Write-Host "NEW VERSION FAILED"
              Write-Host "======================================"

              Write-Host ""
              Write-Host "Service status:"

              Get-Service "TaxBackendService"

              Write-Host ""
              Write-Host "Java processes:"

              Get-CimInstance Win32_Process `
                -Filter "Name='java.exe'" |
                Select-Object ProcessId,ParentProcessId,CommandLine |
                Format-List

              Write-Host ""
              Write-Host "Port 8080:"

              Get-NetTCPConnection `
                -LocalPort 8080 `
                -ErrorAction SilentlyContinue |
                Format-Table

              exit 1
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "NEW VERSION HEALTHY"
          Write-Host "======================================"


      # ============================================================
      # 17. FINAL PRODUCTION VERIFICATION
      # ============================================================

      - name: Verify production deployment
        shell: powershell
        run: |

          $productionJar = "C:\TaxBackend\app\matrix.jar"

          Write-Host "======================================"
          Write-Host "PRODUCTION DEPLOYMENT VERIFIED"
          Write-Host "======================================"

          Get-Item $productionJar |
            Select-Object FullName,Length,LastWriteTime

          Write-Host ""
          Write-Host "Production SHA256:"

          Get-FileHash `
            $productionJar `
            -Algorithm SHA256

          Write-Host ""
          Write-Host "Backend health:"

          curl.exe `
            -s `
            http://127.0.0.1:8080/actuator/health

          Write-Host ""
          Write-Host ""
          Write-Host "DEPLOYMENT SUCCESSFUL."


      # ============================================================
      # 18. ROLLBACK IF ANY DEPLOYMENT STEP FAILS
      # ============================================================

      - name: Rollback production
        if: failure()
        shell: powershell
        run: |

          $productionJar = "C:\TaxBackend\app\matrix.jar"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "DEPLOYMENT FAILED - ROLLBACK"
          Write-Host "======================================"

          if (
              [string]::IsNullOrWhiteSpace("$env:BACKUP_JAR") -or
              !(Test-Path "$env:BACKUP_JAR")
          ) {

              Write-Host "ERROR: Backup JAR is not available."
              Write-Host "Production cannot be automatically restored."

              exit 1
          }

          Write-Host "Backup:"
          Write-Host "$env:BACKUP_JAR"

          # Stop service
          try {

              Stop-Service `
                "TaxBackendService" `
                -Force `
                -ErrorAction Stop

          } catch {

              Write-Host "Service was already stopped."
          }

          Start-Sleep -Seconds 5

          # Restore previous JAR
          Copy-Item `
            "$env:BACKUP_JAR" `
            "$productionJar" `
            -Force `
            -ErrorAction Stop

          Write-Host "Previous JAR restored."

          # Start service
          Start-Service `
            "TaxBackendService" `
            -ErrorAction Stop

          Write-Host "Previous version starting..."

          Start-Sleep -Seconds 10

          # Rollback health check
          $healthUrl = "http://127.0.0.1:8080/actuator/health"

          $healthy = $false

          for ($i = 1; $i -le 18; $i++) {

              Write-Host ""
              Write-Host "Rollback health check $i/18..."

              try {

                  $response = Invoke-WebRequest `
                    -Uri $healthUrl `
                    -UseBasicParsing `
                    -TimeoutSec 5 `
                    -ErrorAction Stop

                  Write-Host "HTTP Status: $($response.StatusCode)"
                  Write-Host "Response: $($response.Content)"

                  if ($response.StatusCode -eq 200) {

                      $health = $response.Content |
                        ConvertFrom-Json

                      if ($health.status -eq "UP") {

                          $healthy = $true
                          break
                      }
                  }

              } catch {

                  Write-Host "Rollback version not ready."
                  Write-Host $_.Exception.Message
              }

              Start-Sleep -Seconds 5
          }

          if (!$healthy) {

              Write-Host ""
              Write-Host "======================================"
              Write-Host "CRITICAL: ROLLBACK FAILED"
              Write-Host "======================================"

              Get-Service "TaxBackendService"

              Get-CimInstance Win32_Process `
                -Filter "Name='java.exe'" |
                Select-Object ProcessId,ParentProcessId,CommandLine |
                Format-List

              exit 1
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "ROLLBACK SUCCESSFUL"
          Write-Host "PREVIOUS VERSION IS HEALTHY"
          Write-Host "======================================"

          # Important:
          # Deployment failed, therefore workflow must remain FAILED.
          exit 1