name: Tax Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: tax-backend-production
  cancel-in-progress: false

jobs:

  build-deploy:
    name: Build and Deploy Tax Backend

    runs-on:
      - self-hosted
      - Windows
      - X64
      - taxbackend

    env:
      APP_PORT: '8081'
      PRODUCTION_JAR: 'C:\TaxBackend\app\matrix.jar'
      BACKUP_DIR: 'C:\TaxBackend\backup'
      SERVICE_NAME: 'TaxBackendService'

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout source code
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA VERSION
      # ============================================================

      - name: Verify Java
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "JAVA VERSION"
          Write-Host "======================================"

          java -version

          if ($LASTEXITCODE -ne 0) {
              throw "Java is not available."
          }


      # ============================================================
      # 3. MAVEN VERSION
      # ============================================================

      - name: Verify Maven Wrapper
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "MAVEN WRAPPER"
          Write-Host "======================================"

          if (-not (Test-Path ".\mvnw.cmd")) {
              throw "mvnw.cmd not found."
          }

          .\mvnw.cmd -version

          if ($LASTEXITCODE -ne 0) {
              throw "Maven wrapper failed."
          }


      # ============================================================
      # 4. CLEAN OLD BUILD
      # ============================================================

      - name: Clean previous build
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "CLEAN BUILD DIRECTORY"
          Write-Host "======================================"

          if (Test-Path ".\target") {
              Remove-Item ".\target" -Recurse -Force -ErrorAction Stop
          }

          Write-Host "Target directory cleaned."


      # ============================================================
      # 5. BUILD
      # ============================================================

      - name: Build Spring Boot application
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "BUILDING APPLICATION"
          Write-Host "======================================"

          .\mvnw.cmd clean package -DskipTests

          if ($LASTEXITCODE -ne 0) {
              throw "Maven build failed."
          }

          Write-Host "Build completed successfully."


      # ============================================================
      # 6. LOCATE CURRENT BUILD JAR
      # ============================================================

      - name: Locate current build JAR
        id: build
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "LOCATING CURRENT BUILD JAR"
          Write-Host "======================================"

          $target = Join-Path $env:GITHUB_WORKSPACE "target"

          if (-not (Test-Path $target)) {
              throw "Target directory does not exist: $target"
          }

          $jars = @(Get-ChildItem `
              -Path $target `
              -Filter "*.jar" `
              -File)

          if ($jars.Count -eq 0) {
              throw "No JAR file found in target."
          }

          if ($jars.Count -gt 1) {
              Write-Host "JAR files found:"
              $jars | ForEach-Object {
                  Write-Host $_.FullName
              }

              throw "Multiple JAR files found. Deployment stopped."
          }

          $jar = $jars[0]

          Write-Host "Current build JAR:"
          Write-Host $jar.FullName

          Write-Host "Size:"
          Write-Host $jar.Length

          "jar_path=$($jar.FullName)" >> $env:GITHUB_OUTPUT


      # ============================================================
      # 7. VALIDATE BUILD JAR
      # ============================================================

      - name: Validate build JAR
        shell: powershell
        run: |
          $jar = "${{ steps.build.outputs.jar_path }}"

          Write-Host "======================================"
          Write-Host "VALIDATING BUILD JAR"
          Write-Host "======================================"

          if (-not (Test-Path $jar)) {
              throw "Build JAR does not exist."
          }

          $file = Get-Item $jar

          if ($file.Length -lt 1MB) {
              throw "Build JAR is suspiciously small."
          }

          Write-Host "JAR:"
          Write-Host $jar

          Write-Host "Size:"
          Write-Host $file.Length

          Write-Host "Last Modified:"
          Write-Host $file.LastWriteTime


      # ============================================================
      # 8. CALCULATE BUILD HASH
      # ============================================================

      - name: Calculate build SHA256
        id: hash
        shell: powershell
        run: |
          $jar = "${{ steps.build.outputs.jar_path }}"

          Write-Host "======================================"
          Write-Host "BUILD SHA256"
          Write-Host "======================================"

          $hash = (Get-FileHash `
              -Path $jar `
              -Algorithm SHA256).Hash

          Write-Host "SHA256:"
          Write-Host $hash

          "jar_hash=$hash" >> $env:GITHUB_OUTPUT


      # ============================================================
      # 9. VERIFY PRODUCTION ENVIRONMENT
      # ============================================================

      - name: Verify production environment
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "PRODUCTION ENVIRONMENT"
          Write-Host "======================================"

          Write-Host "Service:"
          Write-Host $env:SERVICE_NAME

          Write-Host "Production JAR:"
          Write-Host $env:PRODUCTION_JAR

          Write-Host "Backup directory:"
          Write-Host $env:BACKUP_DIR

          Write-Host "Application port:"
          Write-Host $env:APP_PORT

          if (-not (Test-Path $env:PRODUCTION_JAR)) {
              throw "Production JAR does not exist."
          }

          if (-not (Get-Service -Name $env:SERVICE_NAME -ErrorAction SilentlyContinue)) {
              throw "Windows service does not exist."
          }


      # ============================================================
      # 10. CREATE BACKUP
      # ============================================================

      - name: Backup current production JAR
        id: backup
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "BACKUP CURRENT PRODUCTION JAR"
          Write-Host "======================================"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $env:BACKUP_DIR | Out-Null

          if (-not (Test-Path $env:PRODUCTION_JAR)) {
              throw "Production JAR not found."
          }

          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"

          $backupJar = Join-Path `
            $env:BACKUP_DIR `
            "matrix_$timestamp.jar"

          Copy-Item `
            -Path $env:PRODUCTION_JAR `
            -Destination $backupJar `
            -Force `
            -ErrorAction Stop

          if (-not (Test-Path $backupJar)) {
              throw "Backup creation failed."
          }

          Write-Host "Backup created:"
          Write-Host $backupJar

          $backupHash = (Get-FileHash `
              -Path $backupJar `
              -Algorithm SHA256).Hash

          Write-Host "Backup SHA256:"
          Write-Host $backupHash

          "backup_created=true" >> $env:GITHUB_OUTPUT
          "backup_jar=$backupJar" >> $env:GITHUB_OUTPUT
          "backup_hash=$backupHash" >> $env:GITHUB_OUTPUT


      # ============================================================
      # 11. STOP SERVICE
      # ============================================================

      - name: Stop Tax Backend Service
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "STOPPING SERVICE"
          Write-Host "======================================"

          $service = Get-Service `
            -Name $env:SERVICE_NAME `
            -ErrorAction Stop

          Write-Host "Current status:"
          Write-Host $service.Status

          if ($service.Status -ne "Stopped") {

              Stop-Service `
                -Name $env:SERVICE_NAME `
                -Force `
                -ErrorAction Stop
          }

          $timeout = 60
          $elapsed = 0

          do {

              Start-Sleep -Seconds 2

              $service = Get-Service `
                -Name $env:SERVICE_NAME

              $elapsed += 2

              Write-Host "Service status: $($service.Status)"

          } while (
              $service.Status -ne "Stopped" `
              -and $elapsed -lt $timeout
          )

          if ($service.Status -ne "Stopped") {
              throw "Service did not stop within $timeout seconds."
          }

          Write-Host "Service stopped successfully."


      # ============================================================
      # 12. VERIFY PORT RELEASED
      # ============================================================

      - name: Verify application port released
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "VERIFY PORT RELEASE"
          Write-Host "======================================"

          $port = [int]$env:APP_PORT

          $listeners = @(Get-NetTCPConnection `
            -LocalPort $port `
            -State Listen `
            -ErrorAction SilentlyContinue)

          if ($listeners.Count -gt 0) {

              Write-Host "Port $port is still listening."

              $listeners | Format-Table -AutoSize

              throw "Application port $port was not released."
          }

          Write-Host "Port $port is free."


      # ============================================================
      # 13. DEPLOY NEW JAR
      # ============================================================

      - name: Deploy new JAR
        id: deploy
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "DEPLOYING NEW VERSION"
          Write-Host "======================================"

          $newJar = "${{ steps.build.outputs.jar_path }}"

          Write-Host "Source JAR:"
          Write-Host $newJar

          Write-Host "Destination:"
          Write-Host $env:PRODUCTION_JAR

          if (-not (Test-Path $newJar)) {
              throw "New build JAR does not exist."
          }

          Copy-Item `
            -Path $newJar `
            -Destination $env:PRODUCTION_JAR `
            -Force `
            -ErrorAction Stop

          if (-not (Test-Path $env:PRODUCTION_JAR)) {
              throw "Production JAR deployment failed."
          }

          Write-Host "New JAR copied successfully."


      # ============================================================
      # 14. VERIFY DEPLOYED JAR HASH
      # ============================================================

      - name: Verify deployed JAR SHA256
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "VERIFY DEPLOYED JAR"
          Write-Host "======================================"

          $expectedHash = "${{ steps.hash.outputs.jar_hash }}"

          $actualHash = (Get-FileHash `
              -Path $env:PRODUCTION_JAR `
              -Algorithm SHA256).Hash

          Write-Host "Expected:"
          Write-Host $expectedHash

          Write-Host "Actual:"
          Write-Host $actualHash

          if ($expectedHash -ne $actualHash) {
              throw "Deployed JAR SHA256 does not match build JAR."
          }

          Write-Host "JAR hash verified successfully."


      # ============================================================
      # 15. START SERVICE
      # ============================================================

      - name: Start Tax Backend Service
        id: start
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "STARTING NEW VERSION"
          Write-Host "======================================"

          Start-Service `
            -Name $env:SERVICE_NAME `
            -ErrorAction Stop

          Start-Sleep -Seconds 2

          $service = Get-Service `
            -Name $env:SERVICE_NAME

          Write-Host "Service status:"
          Write-Host $service.Status

          if ($service.Status -ne "Running") {
              throw "Service failed to start."
          }

          Write-Host "Service started successfully."


      # ============================================================
      # 16. NEW VERSION HEALTH CHECK
      # ============================================================

      - name: Health check new version
        id: health
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "NEW VERSION HEALTH CHECK"
          Write-Host "======================================"

          $healthUrl = "http://127.0.0.1:$env:APP_PORT/actuator/health"

          Write-Host "Health URL:"
          Write-Host $healthUrl

          $healthy = $false

          for ($i = 1; $i -le 24; $i++) {

              Write-Host ""
              Write-Host "Health check attempt $i/24..."

              try {

                  $response = Invoke-RestMethod `
                    -Uri $healthUrl `
                    -Method Get `
                    -TimeoutSec 5 `
                    -ErrorAction Stop

                  Write-Host "HTTP request successful."

                  Write-Host "Response status:"
                  Write-Host $response.status

                  if ($response.status -eq "UP") {

                      Write-Host ""
                      Write-Host "======================================"
                      Write-Host "NEW VERSION HEALTHY"
                      Write-Host "======================================"

                      $healthy = $true

                      break
                  }

                  Write-Host "Application status is not UP yet."

              }
              catch {

                  Write-Host "Backend not ready yet."
                  Write-Host $_.Exception.Message
              }

              if ($i -lt 24) {
                  Start-Sleep -Seconds 5
              }
          }

          if (-not $healthy) {

              Write-Host ""
              Write-Host "======================================"
              Write-Host "NEW VERSION FAILED"
              Write-Host "======================================"

              Write-Host ""
              Write-Host "Service status:"

              Get-Service `
                -Name $env:SERVICE_NAME |
                Format-Table -AutoSize

              Write-Host ""
              Write-Host "Port status:"

              Get-NetTCPConnection `
                -LocalPort ([int]$env:APP_PORT) `
                -ErrorAction SilentlyContinue |
                Format-Table -AutoSize

              Write-Host ""
              Write-Host "Production JAR:"

              Get-Item `
                $env:PRODUCTION_JAR |
                Format-List FullName,Length,CreationTime,LastWriteTime

              throw "New version failed health check."
          }


      # ============================================================
      # 17. FINAL PRODUCTION VERIFICATION
      # ============================================================

      - name: Final production verification
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "FINAL PRODUCTION VERIFICATION"
          Write-Host "======================================"

          $healthUrl = "http://127.0.0.1:$env:APP_PORT/actuator/health"

          try {

              $response = Invoke-RestMethod `
                -Uri $healthUrl `
                -Method Get `
                -TimeoutSec 10 `
                -ErrorAction Stop

              Write-Host "Health status:"
              Write-Host $response.status

              if ($response.status -ne "UP") {
                  throw "Final health check is not UP."
              }

          }
          catch {

              throw "Final production health check failed: $($_.Exception.Message)"
          }

          $service = Get-Service `
            -Name $env:SERVICE_NAME

          if ($service.Status -ne "Running") {
              throw "Production service is not running."
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "DEPLOYMENT SUCCESSFUL"
          Write-Host "======================================"

          Write-Host "Service: RUNNING"
          Write-Host "Port: $env:APP_PORT"
          Write-Host "Health: UP"


      # ============================================================
      # 18. AUTOMATIC ROLLBACK
      # ============================================================

      - name: Automatic rollback
        if: ${{ failure() && steps.backup.outputs.backup_created == 'true' }}
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "DEPLOYMENT FAILED"
          Write-Host "STARTING AUTOMATIC ROLLBACK"
          Write-Host "======================================"

          $backupJar = "${{ steps.backup.outputs.backup_jar }}"

          if ([string]::IsNullOrWhiteSpace($backupJar)) {
              throw "Backup JAR path is empty."
          }

          Write-Host "Backup JAR:"
          Write-Host $backupJar

          if (-not (Test-Path $backupJar)) {
              throw "Backup JAR does not exist."
          }

          Write-Host "Backup exists."


          # --------------------------------------------------------
          # STOP SERVICE
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Stopping service..."

          Stop-Service `
            -Name $env:SERVICE_NAME `
            -Force `
            -ErrorAction Stop

          $timeout = 60
          $elapsed = 0

          do {

              Start-Sleep -Seconds 2

              $service = Get-Service `
                -Name $env:SERVICE_NAME

              $elapsed += 2

          } while (
              $service.Status -ne "Stopped" `
              -and $elapsed -lt $timeout
          )

          if ($service.Status -ne "Stopped") {
              throw "Service could not be stopped for rollback."
          }


          # --------------------------------------------------------
          # RESTORE BACKUP
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Restoring previous JAR..."

          Copy-Item `
            -Path $backupJar `
            -Destination $env:PRODUCTION_JAR `
            -Force `
            -ErrorAction Stop

          Write-Host "Previous JAR restored."


          # --------------------------------------------------------
          # VERIFY ROLLBACK HASH
          # --------------------------------------------------------

          $backupHash = "${{ steps.backup.outputs.backup_hash }}"

          $restoredHash = (Get-FileHash `
              -Path $env:PRODUCTION_JAR `
              -Algorithm SHA256).Hash

          Write-Host ""
          Write-Host "Backup SHA256:"
          Write-Host $backupHash

          Write-Host "Restored SHA256:"
          Write-Host $restoredHash

          if ($backupHash -ne $restoredHash) {
              throw "Rollback JAR hash verification failed."
          }

          Write-Host "Rollback JAR verified."


          # --------------------------------------------------------
          # START PREVIOUS VERSION
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Starting previous version..."

          Start-Service `
            -Name $env:SERVICE_NAME `
            -ErrorAction Stop


          # --------------------------------------------------------
          # ROLLBACK HEALTH CHECK
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "======================================"
          Write-Host "ROLLBACK HEALTH CHECK"
          Write-Host "======================================"

          $healthUrl = "http://127.0.0.1:$env:APP_PORT/actuator/health"

          Write-Host "Health URL:"
          Write-Host $healthUrl

          $rollbackHealthy = $false

          for ($i = 1; $i -le 24; $i++) {

              Write-Host ""
              Write-Host "Rollback health check $i/24..."

              try {

                  $response = Invoke-RestMethod `
                    -Uri $healthUrl `
                    -Method Get `
                    -TimeoutSec 5 `
                    -ErrorAction Stop

                  Write-Host "HTTP request successful."

                  Write-Host "Response status:"
                  Write-Host $response.status

                  if ($response.status -eq "UP") {

                      Write-Host ""
                      Write-Host "======================================"
                      Write-Host "ROLLBACK SUCCESSFUL"
                      Write-Host "======================================"

                      $rollbackHealthy = $true

                      break
                  }

                  Write-Host "Rollback application status is not UP yet."

              }
              catch {

                  Write-Host "Rollback version not ready."
                  Write-Host $_.Exception.Message
              }

              if ($i -lt 24) {
                  Start-Sleep -Seconds 5
              }
          }


          # --------------------------------------------------------
          # VERIFY ROLLBACK
          # --------------------------------------------------------

          if (-not $rollbackHealthy) {

              Write-Host ""
              Write-Host "======================================"
              Write-Host "CRITICAL: ROLLBACK FAILED"
              Write-Host "======================================"

              Write-Host ""
              Write-Host "Service status:"

              Get-Service `
                -Name $env:SERVICE_NAME |
                Format-Table -AutoSize

              Write-Host ""
              Write-Host "Port status:"

              Get-NetTCPConnection `
                -LocalPort ([int]$env:APP_PORT) `
                -ErrorAction SilentlyContinue |
                Format-Table -AutoSize

              throw "Rollback completed but application is not healthy."
          }


          # --------------------------------------------------------
          # IMPORTANT:
          # Keep workflow FAILED because deployment failed,
          # even though production has been safely restored.
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Production has been restored to previous version."
          Write-Host "The workflow will remain FAILED because the new deployment failed."

          exit 1