  name: Tax Backend CI/CD

  on:
    push:
      branches:
        - main

    workflow_dispatch:

  # ================================================================
  # GLOBAL CONFIGURATION
  # ================================================================

  env:
    APP_PORT: '8081'
    PRODUCTION_JAR: 'C:\TaxBackend\app\matrix.jar'
    BACKUP_DIR: 'C:\TaxBackend\backup'
    SERVICE_NAME: 'TaxBackendService'

  # ================================================================
  # PREVENT TWO PRODUCTION DEPLOYMENTS AT THE SAME TIME
  # ================================================================

  concurrency:
    group: tax-backend-production
    cancel-in-progress: false

  # ================================================================
  # JOB
  # ================================================================

  jobs:

    build-and-deploy:

      runs-on:
        - self-hosted
        - Windows
        - X64
        - taxbackend

      steps:

        # ============================================================
        # 1. CHECKOUT
        # ============================================================

        - name: Checkout source code
          uses: actions/checkout@v4

        # ============================================================
        # 2. VERIFY JAVA
        # ============================================================

        - name: Verify Java
          shell: powershell
          run: |
            Write-Host ""
            Write-Host "======================================"
            Write-Host "JAVA VERIFICATION"
            Write-Host "======================================"
            
            java -version
            
            if ($LASTEXITCODE -ne 0) {
                Write-Host "ERROR: Java is not available."
                exit 1
            }
            
            Write-Host "Java verification successful."

        # ============================================================
        # 3. VERIFY MAVEN WRAPPER
        # ============================================================

        - name: Verify Maven Wrapper
          shell: powershell
          run: |
            Write-Host ""
            Write-Host "======================================"
            Write-Host "MAVEN VERIFICATION"
            Write-Host "======================================"
            
            $mvn = Join-Path $env:GITHUB_WORKSPACE "mvnw.cmd"
            
            Write-Host "Maven wrapper:"
            Write-Host $mvn
            
            if (!(Test-Path $mvn)) {
                Write-Host "ERROR: mvnw.cmd not found."
                exit 1
            }
            
            Write-Host "mvnw.cmd found."

        # ============================================================
        # 4. CLEAN PREVIOUS BUILD
        # ============================================================

        - name: Clean previous build
          shell: powershell
          run: |
            Write-Host ""
            Write-Host "======================================"
            Write-Host "CLEANING OLD BUILD"
            Write-Host "======================================"
            
            $target = Join-Path $env:GITHUB_WORKSPACE "target"
            
            if (Test-Path $target) {
                Write-Host "Removing old target directory..."
            
                Remove-Item `
                  $target `
                  -Recurse `
                  -Force `
                  -ErrorAction Stop
            }
            
            Write-Host "Old build removed."

        # ============================================================
        # 5. BUILD APPLICATION
        # ============================================================

        - name: Build application
          shell: powershell
          run: |
            Write-Host ""
            Write-Host "======================================"
            Write-Host "BUILDING APPLICATION"
            Write-Host "======================================"
            
            Set-Location $env:GITHUB_WORKSPACE
            
            .\mvnw.cmd clean package -DskipTests
            
            if ($LASTEXITCODE -ne 0) {
                Write-Host "ERROR: Maven build failed."
                exit 1
            }
            
            Write-Host "BUILD SUCCESSFUL."

        # ============================================================
        # 6. LOCATE CURRENT BUILD JAR
        # ============================================================

        - name: Locate current build JAR
          id: build
          shell: powershell
          run: |
            Write-Host ""
            Write-Host "======================================"
            Write-Host "LOCATING CURRENT BUILD JAR"
            Write-Host "======================================"
            
            $target = Join-Path $env:GITHUB_WORKSPACE "target"
            
            $jars = @(
              Get-ChildItem `
                $target `
                -Filter "*.jar" `
                -File
            )
            
            if ($jars.Count -eq 0) {
                Write-Host "ERROR: No JAR found."
                exit 1
            }
            
            if ($jars.Count -gt 1) {
                Write-Host "ERROR: Multiple JAR files found."
            
                $jars | ForEach-Object {
                    Write-Host $_.FullName
                }
            
                exit 1
            }
            
            $jar = $jars[0]
            
            Write-Host ""
            Write-Host "CURRENT BUILD JAR"
            Write-Host "Path: $($jar.FullName)"
            Write-Host "Size: $($jar.Length) bytes"
            Write-Host "Time: $($jar.LastWriteTime)"
            
            "jar_path=$($jar.FullName)" >> $env:GITHUB_OUTPUT

        # ============================================================
        # 7. CALCULATE BUILD SHA256
        # ============================================================

        - name: Calculate build checksum
          id: checksum
          shell: powershell
          run: |
            $jar = "${{ steps.build.outputs.jar_path }}"
            
            if (!(Test-Path $jar)) {
                Write-Host "ERROR: Build JAR not found."
                exit 1
            }
            
            $hash = (
              Get-FileHash `
                $jar `
                -Algorithm SHA256
            ).Hash
            
            Write-Host ""
            Write-Host "======================================"
            Write-Host "BUILD SHA256"
            Write-Host "======================================"
            
            Write-Host $hash
            
            "sha256=$hash" >> $env:GITHUB_OUTPUT

        # ============================================================
        # 8. VALIDATE BUILD ARTIFACT
        # ============================================================

        - name: Validate build artifact
          shell: powershell
          run: |
            $jar = "${{ steps.build.outputs.jar_path }}"
            
            if (!(Test-Path $jar)) {
                Write-Host "ERROR: Build artifact does not exist."
                exit 1
            }
            
            $file = Get-Item $jar
            
            Write-Host ""
            Write-Host "======================================"
            Write-Host "ARTIFACT VALIDATION"
            Write-Host "======================================"
            
            Write-Host "File: $($file.FullName)"
            Write-Host "Size: $($file.Length) bytes"
            
            if ($file.Length -lt 1MB) {
                Write-Host "ERROR: JAR is suspiciously small."
                exit 1
            }
            
            Write-Host "Artifact validation successful."

        # ============================================================
        # 9. PREPARE BACKUP DIRECTORY
        # ============================================================

        - name: Prepare backup directory
          shell: powershell
          run: |
            Write-Host ""
            Write-Host "======================================"
            Write-Host "BACKUP DIRECTORY"
            Write-Host "======================================"
            
            if (!(Test-Path $env:BACKUP_DIR)) {
                New-Item `
                  -ItemType Directory `
                  -Path $env:BACKUP_DIR `
                  -Force | Out-Null
            }
            
            Write-Host "Backup directory:"
            Write-Host $env:BACKUP_DIR

        # ============================================================
        # 10. BACKUP CURRENT PRODUCTION JAR
        # ============================================================

        - name: Backup current production JAR
          id: backup
          shell: powershell
          run: |
            $productionJar = $env:PRODUCTION_JAR
            $backupDir = $env:BACKUP_DIR
            
            Write-Host ""
            Write-Host "======================================"
            Write-Host "BACKUP CURRENT PRODUCTION"
            Write-Host "======================================"
            
            if (!(Test-Path $productionJar)) {
                Write-Host "No production JAR exists."
                Write-Host "This is the first deployment."
            
                "backup_created=false" >> $env:GITHUB_OUTPUT
                "backup_jar=" >> $env:GITHUB_OUTPUT
            
                exit 0
            }
            
            $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"
            
            $backupJar = Join-Path `
              $backupDir `
              "matrix_$timestamp.jar"
            
            Write-Host "Production JAR:"
            Write-Host $productionJar
            
            Write-Host "Backup JAR:"
            Write-Host $backupJar
            
            Copy-Item `
              $productionJar `
              $backupJar `
              -Force `
              -ErrorAction Stop
            
            if (!(Test-Path $backupJar)) {
                Write-Host "ERROR: Backup creation failed."
                exit 1
            }
            
            $productionHash = (
              Get-FileHash `
                $productionJar `
                -Algorithm SHA256
            ).Hash
            
            $backupHash = (
              Get-FileHash `
                $backupJar `
                -Algorithm SHA256
            ).Hash
            
            Write-Host ""
            Write-Host "Production SHA256:"
            Write-Host $productionHash
            
            Write-Host "Backup SHA256:"
            Write-Host $backupHash
            
            if ($productionHash -ne $backupHash) {
                Write-Host "ERROR: Backup hash mismatch."
                exit 1
            }
            
            Write-Host "BACKUP VERIFIED SUCCESSFULLY."
            
            "backup_created=true" >> $env:GITHUB_OUTPUT
            "backup_jar=$backupJar" >> $env:GITHUB_OUTPUT

        # ============================================================
        # 11. STOP PRODUCTION SERVICE
        # ============================================================

        - name: Stop Tax Backend Service
          shell: powershell
          run: |
            Write-Host ""
            Write-Host "======================================"
            Write-Host "STOPPING PRODUCTION SERVICE"
            Write-Host "======================================"
            
            $service = Get-Service `
              $env:SERVICE_NAME `
              -ErrorAction Stop
            
            Write-Host "Current status: $($service.Status)"
            
            if ($service.Status -eq "Running") {
            
                Stop-Service `
                  $env:SERVICE_NAME `
                  -Force `
                  -ErrorAction Stop
            
                $timeout = 30
                $elapsed = 0
            
                do {
                    Start-Sleep -Seconds 1
                    $elapsed++
            
                    $service = Get-Service `
                      $env:SERVICE_NAME
            
                } while (
                    $service.Status -ne "Stopped" -and
                    $elapsed -lt $timeout
                )
            
                if ($service.Status -ne "Stopped") {
                    Write-Host "ERROR: Service did not stop."
                    exit 1
                }
            }
            
            Write-Host "Service stopped successfully."

        # ============================================================
        # 12. VERIFY PORT 8081 IS FREE
        # ============================================================

        - name: Verify application port is free
          shell: powershell
          run: |
            Write-Host ""
            Write-Host "======================================"
            Write-Host "VERIFYING PORT $env:APP_PORT"
            Write-Host "======================================"
            
            Start-Sleep -Seconds 3
            
            $connection = Get-NetTCPConnection `
              -LocalPort ([int]$env:APP_PORT) `
              -State Listen `
              -ErrorAction SilentlyContinue
            
            if ($connection) {
                Write-Host "ERROR: Port $env:APP_PORT is still in use."
                $connection | Format-Table
                exit 1
            }
            
            Write-Host "Port $env:APP_PORT is free."

        # ============================================================
        # 13. DEPLOY CURRENT BUILD
        # ============================================================

        - name: Deploy current build JAR
          shell: powershell
          run: |
            $sourceJar = "${{ steps.build.outputs.jar_path }}"
            $productionJar = $env:PRODUCTION_JAR
            
            Write-Host ""
            Write-Host "======================================"
            Write-Host "DEPLOYING CURRENT BUILD"
            Write-Host "======================================"
            
            Write-Host "Source:"
            Write-Host $sourceJar
            
            Write-Host "Destination:"
            Write-Host $productionJar
            
            if (!(Test-Path $sourceJar)) {
                Write-Host "ERROR: Source JAR does not exist."
                exit 1
            }
            
            $sourceInfo = Get-Item $sourceJar
            
            Write-Host "Source size: $($sourceInfo.Length) bytes"
            
            Copy-Item `
              $sourceJar `
              $productionJar `
              -Force `
              -ErrorAction Stop
            
            Write-Host "CURRENT BUILD COPIED TO PRODUCTION."

        # ============================================================
        # 14. VERIFY DEPLOYED JAR
        # ============================================================

        - name: Verify deployed JAR checksum
          shell: powershell
          run: |
            $sourceJar = "${{ steps.build.outputs.jar_path }}"
            $productionJar = $env:PRODUCTION_JAR
            
            $sourceHash = (
              Get-FileHash `
                $sourceJar `
                -Algorithm SHA256
            ).Hash
            
            $productionHash = (
              Get-FileHash `
                $productionJar `
                -Algorithm SHA256
            ).Hash
            
            Write-Host ""
            Write-Host "======================================"
            Write-Host "DEPLOYMENT HASH VERIFICATION"
            Write-Host "======================================"
            
            Write-Host "Build SHA256:"
            Write-Host $sourceHash
            
            Write-Host "Production SHA256:"
            Write-Host $productionHash
            
            if ($sourceHash -ne $productionHash) {
                Write-Host "ERROR: HASH MISMATCH."
                exit 1
            }
            
            Write-Host "HASH MATCH."
            Write-Host "EXACT BUILD ARTIFACT VERIFIED."

        # ============================================================
        # 15. START SERVICE
        # ============================================================

        - name: Start Tax Backend Service
          shell: powershell
          run: |
            Write-Host ""
            Write-Host "======================================"
            Write-Host "STARTING TAX BACKEND"
            Write-Host "======================================"
            
            Start-Service `
              $env:SERVICE_NAME `
              -ErrorAction Stop
            
            Start-Sleep -Seconds 5
            
            $service = Get-Service `
              $env:SERVICE_NAME
            
            Write-Host "Service status: $($service.Status)"
            
            if ($service.Status -ne "Running") {
                Write-Host "ERROR: Service failed to start."
                exit 1
            }
            
            Write-Host "Service started."

        # ============================================================
        # 16. VERIFY NEW VERSION HEALTH
        #
        # YOUR APPLICATION USES PORT 8081
        # ============================================================

        - name: Verify new version health
          shell: powershell
          run: |
            $healthUrl = "http://127.0.0.1:$env:APP_PORT/actuator/health"
            
            Write-Host ""
            Write-Host "======================================"
            Write-Host "NEW VERSION HEALTH CHECK"
            Write-Host "======================================"
            
            Write-Host "Health URL:"
            Write-Host $healthUrl
            
            $healthy = $false
            
            for ($i = 1; $i -le 24; $i++) {
            
                Write-Host ""
                Write-Host "Health check attempt $i/24..."
            
                try {
            
                    $response = Invoke-WebRequest `
                      -Uri $healthUrl `
                      -UseBasicParsing `
                      -TimeoutSec 5 `
                      -ErrorAction Stop
            
                    Write-Host "HTTP Status: $($response.StatusCode)"
                    Write-Host "Response: $($response.Content)"
            
                    if ($response.StatusCode -eq 200) {
            
                        $health = $response.Content |
                          ConvertFrom-Json
            
                        Write-Host "Application status: $($health.status)"
            
                        if ($health.status -eq "UP") {
                            $healthy = $true
                            break
                        }
                    }
            
                }
                catch {
            
                    Write-Host "Backend not ready yet."
                    Write-Host $_.Exception.Message
                }
            
                Start-Sleep -Seconds 5
            }
            
            if (!$healthy) {
            
                Write-Host ""
                Write-Host "======================================"
                Write-Host "NEW VERSION FAILED"
                Write-Host "======================================"
            
                Write-Host ""
                Write-Host "Service status:"
                Get-Service $env:SERVICE_NAME
            
                Write-Host ""
                Write-Host "Java processes:"
            
                Get-CimInstance Win32_Process `
                  -Filter "Name='java.exe'" |
                  Select-Object `
                    ProcessId,
                    ParentProcessId,
                    CommandLine |
                  Format-List
            
                Write-Host ""
                Write-Host "Port $env:APP_PORT:"
            
                Get-NetTCPConnection `
                  -LocalPort ([int]$env:APP_PORT) `
                  -ErrorAction SilentlyContinue |
                  Format-Table
            
                Write-Host ""
                Write-Host "Production JAR:"
            
                Get-Item $env:PRODUCTION_JAR |
                  Select-Object `
                    FullName,
                    Length,
                    CreationTime,
                    LastWriteTime
            
                exit 1
            }
            
            Write-Host ""
            Write-Host "======================================"
            Write-Host "NEW VERSION IS HEALTHY"
            Write-Host "======================================"

        # ============================================================
        # 17. FINAL PRODUCTION VERIFICATION
        # ============================================================

        - name: Final production verification
          shell: powershell
          run: |
            $productionJar = $env:PRODUCTION_JAR
            
            Write-Host ""
            Write-Host "======================================"
            Write-Host "FINAL PRODUCTION VERIFICATION"
            Write-Host "======================================"
            
            Get-Item $productionJar |
              Select-Object `
                FullName,
                Length,
                CreationTime,
                LastWriteTime
            
            Write-Host ""
            Write-Host "Production SHA256:"
            
            Get-FileHash `
              $productionJar `
              -Algorithm SHA256
            
            Write-Host ""
            Write-Host "Backend health:"
            
            curl.exe `
              -s `
              "http://127.0.0.1:$env:APP_PORT/actuator/health"
            
            Write-Host ""
            Write-Host ""
            Write-Host "======================================"
            Write-Host "DEPLOYMENT SUCCESSFUL"
            Write-Host "======================================"

        # ============================================================
        # 18. AUTOMATIC ROLLBACK
        # ============================================================

        - name: Rollback production
          if: failure()
          shell: powershell
          run: |
            
            $productionJar = $env:PRODUCTION_JAR
            
            # IMPORTANT:
            # Read backup path from the backup STEP OUTPUT.
            # Do not use $env:BACKUP_JAR.
            
            $backupJar = "${{ steps.backup.outputs.backup_jar }}"
            
            Write-Host ""
            Write-Host "======================================"
            Write-Host "DEPLOYMENT FAILED"
            Write-Host "STARTING AUTOMATIC ROLLBACK"
            Write-Host "======================================"
            
            Write-Host "Backup JAR:"
            Write-Host $backupJar
            
            if ([string]::IsNullOrWhiteSpace($backupJar)) {
            
                Write-Host "CRITICAL ERROR: Backup path is empty."
                exit 1
            }
            
            if (!(Test-Path $backupJar)) {
            
                Write-Host "CRITICAL ERROR: Backup JAR does not exist."
                Write-Host $backupJar
                exit 1
            }
            
            Write-Host "Backup exists."
            
            # --------------------------------------------------------
            # STOP SERVICE
            # --------------------------------------------------------
            
            Write-Host ""
            Write-Host "Stopping service..."
            
            try {
            
                Stop-Service `
                  $env:SERVICE_NAME `
                  -Force `
                  -ErrorAction Stop
            
            }
            catch {
            
                Write-Host "Service was already stopped."
            }
            
            Start-Sleep -Seconds 5
            
            # --------------------------------------------------------
            # RESTORE PREVIOUS JAR
            # --------------------------------------------------------
            
            Write-Host ""
            Write-Host "Restoring previous JAR..."
            
            Copy-Item `
              $backupJar `
              $productionJar `
              -Force `
              -ErrorAction Stop
            
            Write-Host "Previous JAR restored."
            
            # --------------------------------------------------------
            # VERIFY RESTORED JAR
            # --------------------------------------------------------
            
            $backupHash = (
              Get-FileHash `
                $backupJar `
                -Algorithm SHA256
            ).Hash
            
            $restoredHash = (
              Get-FileHash `
                $productionJar `
                -Algorithm SHA256
            ).Hash
            
            Write-Host ""
            Write-Host "Backup SHA256:"
            Write-Host $backupHash
            
            Write-Host "Restored SHA256:"
            Write-Host $restoredHash
            
            if ($backupHash -ne $restoredHash) {
            
                Write-Host "CRITICAL: Rollback hash mismatch."
                exit 1
            }
            
            Write-Host "Rollback JAR verified."
            
            # --------------------------------------------------------
            # START PREVIOUS VERSION
            # --------------------------------------------------------
            
            Write-Host ""
            Write-Host "Starting previous version..."
            
            Start-Service `
              $env:SERVICE_NAME `
              -ErrorAction Stop
            
            Start-Sleep -Seconds 5
            
            # --------------------------------------------------------
            # ROLLBACK HEALTH CHECK
            # --------------------------------------------------------
            
            $healthUrl = "http://127.0.0.1:$env:APP_PORT/actuator/health"
            
            Write-Host ""
            Write-Host "======================================"
            Write-Host "ROLLBACK HEALTH CHECK"
            Write-Host "======================================"
            
            Write-Host "Health URL:"
            Write-Host $healthUrl
            
            $healthy = $false
            
            for ($i = 1; $i -le 24; $i++) {
            
                Write-Host ""
                Write-Host "Rollback health check $i/24..."
            
                try {
            
                    $response = Invoke-WebRequest `
                      -Uri $healthUrl `
                      -UseBasicParsing `
                      -TimeoutSec 5 `
                      -ErrorAction Stop
            
                    Write-Host "HTTP Status: $($response.StatusCode)"
                    Write-Host "Response: $($response.Content)"
            
                    if ($response.StatusCode -eq 200) {
            
                        $health = $response.Content |
                          ConvertFrom-Json
            
                        Write-Host "Application status: $($health.status)"
            
                        if ($health.status -eq "UP") {
            
                            $healthy = $true
                            break
                        }
                    }
            
                }
                catch {
            
                    Write-Host "Rollback version not ready."
                    Write-Host $_.Exception.Message
                }
            
                Start-Sleep -Seconds 5
            }
            
            if (!$healthy) {
            
                Write-Host ""
                Write-Host "======================================"
                Write-Host "CRITICAL: ROLLBACK FAILED"
                Write-Host "======================================"
            
                Get-Service $env:SERVICE_NAME
            
                Write-Host ""
                Write-Host "Java processes:"
            
                Get-CimInstance Win32_Process `
                  -Filter "Name='java.exe'" |
                  Select-Object `
                    ProcessId,
                    ParentProcessId,
                    CommandLine |
                  Format-List
            
                Write-Host ""
                Write-Host "Port $env:APP_PORT:"
            
                Get-NetTCPConnection `
                  -LocalPort ([int]$env:APP_PORT) `
                  -ErrorAction SilentlyContinue |
                  Format-Table
            
                exit 1
            }
            
            Write-Host ""
            Write-Host "======================================"
            Write-Host "ROLLBACK SUCCESSFUL"
            Write-Host "======================================"
            
            Write-Host "Previous version is healthy."
            Write-Host "Production has been restored."
            
            # Keep workflow FAILED because new deployment failed.
            exit 1

