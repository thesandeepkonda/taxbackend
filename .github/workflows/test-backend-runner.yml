name: Tax Backend CI/CD

on:

  # Deploy automatically whenever code is pushed to main
  push:
    branches:
      - main

  # Allow manual deployment from GitHub Actions
  workflow_dispatch:


# ================================================================
# GLOBAL CONFIGURATION
# ================================================================

env:

  # Your Spring Boot application is running on 8081
  APP_PORT: "8081"

  # Production JAR
  PRODUCTION_JAR: "C:\TaxBackend\app\matrix.jar"

  # Backup directory
  BACKUP_DIR: "C:\TaxBackend\backup"

  # Windows service
  SERVICE_NAME: "TaxBackendService"


# ================================================================
# PREVENT TWO DEPLOYMENTS AT THE SAME TIME
# ================================================================

concurrency:

  group: tax-backend-production

  # Do NOT cancel a running production deployment
  cancel-in-progress: false


# ================================================================
# JOB
# ================================================================

jobs:

  build-and-deploy:

    runs-on:

      - self-hosted
      - Windows
      - X64
      - taxbackend


    steps:


      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout source code

        uses: actions/checkout@v4


      # ============================================================
      # 2. VERIFY JAVA
      # ============================================================

      - name: Verify Java

        shell: powershell

        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "JAVA VERIFICATION"
          Write-Host "======================================"

          java -version

          if ($LASTEXITCODE -ne 0) {

              Write-Host "ERROR: Java is not available."

              exit 1
          }

          Write-Host "Java verification successful."


      # ============================================================
      # 3. VERIFY MAVEN WRAPPER
      # ============================================================

      - name: Verify Maven Wrapper

        shell: powershell

        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "MAVEN VERIFICATION"
          Write-Host "======================================"

          $mvn = Join-Path `
            $env:GITHUB_WORKSPACE `
            "mvnw.cmd"

          Write-Host "Maven wrapper:"
          Write-Host $mvn

          if (!(Test-Path $mvn)) {

              Write-Host "ERROR: mvnw.cmd not found."

              exit 1
          }

          Write-Host "mvnw.cmd found."


      # ============================================================
      # 4. CLEAN PREVIOUS BUILD
      #
      # IMPORTANT:
      # Self-hosted runner keeps its workspace between runs.
      # Therefore remove target before every build.
      # ============================================================

      - name: Clean previous build

        shell: powershell

        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "CLEANING OLD BUILD"
          Write-Host "======================================"

          $target = Join-Path `
            $env:GITHUB_WORKSPACE `
            "target"

          if (Test-Path $target) {

              Write-Host "Removing old target directory..."

              Remove-Item `
                $target `
                -Recurse `
                -Force `
                -ErrorAction Stop
          }

          Write-Host "Old build removed."


      # ============================================================
      # 5. BUILD APPLICATION
      # ============================================================

      - name: Build application

        shell: powershell

        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "BUILDING APPLICATION"
          Write-Host "======================================"

          Set-Location $env:GITHUB_WORKSPACE

          .\mvnw.cmd clean package -DskipTests

          if ($LASTEXITCODE -ne 0) {

              Write-Host ""
              Write-Host "ERROR: Maven build failed."

              exit 1
          }

          Write-Host ""
          Write-Host "BUILD SUCCESSFUL."


      # ============================================================
      # 6. LOCATE CURRENT BUILD JAR
      #
      # Only use the JAR created by THIS GitHub Actions run.
      # Never search the whole server.
      # ============================================================

      - name: Locate current build JAR

        id: build

        shell: powershell

        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "LOCATING CURRENT BUILD JAR"
          Write-Host "======================================"

          $target = Join-Path `
            $env:GITHUB_WORKSPACE `
            "target"

          $jars = @(
            Get-ChildItem `
              $target `
              -Filter "*.jar" `
              -File
          )

          if ($jars.Count -eq 0) {

              Write-Host "ERROR: No JAR found in target."

              exit 1
          }

          if ($jars.Count -gt 1) {

              Write-Host "ERROR: Multiple JAR files found."

              $jars | ForEach-Object {

                  Write-Host $_.FullName
              }

              exit 1
          }

          $jar = $jars[0]

          Write-Host ""
          Write-Host "CURRENT BUILD JAR"
          Write-Host "-----------------"

          Write-Host "Path:"
          Write-Host $jar.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($jar.Length) bytes"

          Write-Host ""
          Write-Host "Last Write Time:"
          Write-Host $jar.LastWriteTime

          # Pass JAR path to later steps
          "jar_path=$($jar.FullName)" >> $env:GITHUB_OUTPUT


      # ============================================================
      # 7. CALCULATE BUILD SHA256
      # ============================================================

      - name: Calculate build checksum

        id: checksum

        shell: powershell

        run: |

          $jar = "${{ steps.build.outputs.jar_path }}"

          if (!(Test-Path $jar)) {

              Write-Host "ERROR: Build JAR not found."

              exit 1
          }

          $hash = (
            Get-FileHash `
              $jar `
              -Algorithm SHA256
          ).Hash

          Write-Host ""
          Write-Host "======================================"
          Write-Host "BUILD SHA256"
          Write-Host "======================================"

          Write-Host $hash

          "sha256=$hash" >> $env:GITHUB_OUTPUT


      # ============================================================
      # 8. VALIDATE BUILD ARTIFACT
      # ============================================================

      - name: Validate build artifact

        shell: powershell

        run: |

          $jar = "${{ steps.build.outputs.jar_path }}"

          if (!(Test-Path $jar)) {

              Write-Host "ERROR: Build artifact does not exist."

              exit 1
          }

          $file = Get-Item $jar

          Write-Host ""
          Write-Host "======================================"
          Write-Host "ARTIFACT VALIDATION"
          Write-Host "======================================"

          Write-Host "File:"
          Write-Host $file.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($file.Length) bytes"

          # Minimum sanity check
          if ($file.Length -lt 1MB) {

              Write-Host "ERROR: JAR is suspiciously small."

              exit 1
          }

          Write-Host ""
          Write-Host "Artifact validation successful."


      # ============================================================
      # 9. PREPARE BACKUP DIRECTORY
      # ============================================================

      - name: Prepare backup directory

        shell: powershell

        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "BACKUP DIRECTORY"
          Write-Host "======================================"

          if (!(Test-Path $env:BACKUP_DIR)) {

              New-Item `
                -ItemType Directory `
                -Path $env:BACKUP_DIR `
                -Force | Out-Null
          }

          Write-Host "Backup directory:"
          Write-Host $env:BACKUP_DIR


      # ============================================================
      # 10. BACKUP CURRENT PRODUCTION JAR
      #
      # This creates a timestamped backup before production changes.
      # ============================================================

      - name: Backup current production JAR

        id: backup

        shell: powershell

        run: |

          $productionJar = $env:PRODUCTION_JAR
          $backupDir = $env:BACKUP_DIR

          Write-Host ""
          Write-Host "======================================"
          Write-Host "BACKUP CURRENT PRODUCTION"
          Write-Host "======================================"

          # First deployment
          if (!(Test-Path $productionJar)) {

              Write-Host "No production JAR exists."
              Write-Host "This is the first deployment."

              "backup_created=false" >> $env:GITHUB_OUTPUT
              "backup_jar=" >> $env:GITHUB_OUTPUT

              exit 0
          }

          # Timestamp
          $timestamp = Get-Date -Format "yyyyMMdd_HHmmss"

          $backupJar = Join-Path `
            $backupDir `
            "matrix_$timestamp.jar"

          Write-Host "Production JAR:"
          Write-Host $productionJar

          Write-Host ""
          Write-Host "Backup JAR:"
          Write-Host $backupJar

          # Copy production JAR
          Copy-Item `
            $productionJar `
            $backupJar `
            -Force `
            -ErrorAction Stop

          # Verify backup exists
          if (!(Test-Path $backupJar)) {

              Write-Host "ERROR: Backup creation failed."

              exit 1
          }

          # Calculate production hash
          $productionHash = (
            Get-FileHash `
              $productionJar `
              -Algorithm SHA256
          ).Hash

          # Calculate backup hash
          $backupHash = (
            Get-FileHash `
              $backupJar `
              -Algorithm SHA256
          ).Hash

          Write-Host ""
          Write-Host "Production SHA256:"
          Write-Host $productionHash

          Write-Host ""
          Write-Host "Backup SHA256:"
          Write-Host $backupHash

          # Verify backup
          if ($productionHash -ne $backupHash) {

              Write-Host ""
              Write-Host "ERROR: Backup hash mismatch."

              exit 1
          }

          Write-Host ""
          Write-Host "BACKUP VERIFIED SUCCESSFULLY."

          # Step outputs
          "backup_created=true" >> $env:GITHUB_OUTPUT
          "backup_jar=$backupJar" >> $env:GITHUB_OUTPUT


      # ============================================================
      # 11. STOP PRODUCTION SERVICE
      # ============================================================

      - name: Stop Tax Backend Service

        shell: powershell

        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "STOPPING PRODUCTION SERVICE"
          Write-Host "======================================"

          $service = Get-Service `
            $env:SERVICE_NAME `
            -ErrorAction Stop

          Write-Host "Current service status:"
          Write-Host $service.Status

          if ($service.Status -eq "Running") {

              Write-Host "Stopping service..."

              Stop-Service `
                $env:SERVICE_NAME `
                -Force `
                -ErrorAction Stop

              # Wait until service is stopped
              $timeout = 30
              $elapsed = 0

              do {

                  Start-Sleep -Seconds 1
                  $elapsed++

                  $service = Get-Service `
                    $env:SERVICE_NAME

              } while (
                  $service.Status -ne "Stopped" -and
                  $elapsed -lt $timeout
              )

              if ($service.Status -ne "Stopped") {

                  Write-Host "ERROR: Service did not stop."

                  exit 1
              }
          }

          Write-Host "Service stopped successfully."


      # ============================================================
      # 12. VERIFY PORT 8081 IS FREE
      # ============================================================

      - name: Verify application port is free

        shell: powershell

        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "VERIFYING PORT $env:APP_PORT"
          Write-Host "======================================"

          Start-Sleep -Seconds 3

          $connection = Get-NetTCPConnection `
            -LocalPort ([int]$env:APP_PORT) `
            -State Listen `
            -ErrorAction SilentlyContinue

          if ($connection) {

              Write-Host ""
              Write-Host "ERROR: Port $env:APP_PORT is still in use."

              $connection | Format-Table

              exit 1
          }

          Write-Host "Port $env:APP_PORT is free."


      # ============================================================
      # 13. DEPLOY CURRENT BUILD JAR
      #
      # THIS IS THE IMPORTANT PART:
      # The source is ALWAYS target\*.jar from THIS RUN.
      # ============================================================

      - name: Deploy current build JAR

        shell: powershell

        run: |

          $sourceJar = "${{ steps.build.outputs.jar_path }}"
          $productionJar = $env:PRODUCTION_JAR

          Write-Host ""
          Write-Host "======================================"
          Write-Host "DEPLOYING CURRENT BUILD"
          Write-Host "======================================"

          Write-Host "Source:"
          Write-Host $sourceJar

          Write-Host ""
          Write-Host "Destination:"
          Write-Host $productionJar

          if (!(Test-Path $sourceJar)) {

              Write-Host "ERROR: Source JAR does not exist."

              exit 1
          }

          $sourceInfo = Get-Item $sourceJar

          Write-Host ""
          Write-Host "Source JAR size:"
          Write-Host "$($sourceInfo.Length) bytes"

          # Copy current build
          Copy-Item `
            $sourceJar `
            $productionJar `
            -Force `
            -ErrorAction Stop

          Write-Host ""
          Write-Host "CURRENT BUILD COPIED TO PRODUCTION."


      # ============================================================
      # 14. VERIFY PRODUCTION JAR HASH
      #
      # This guarantees the exact build artifact reached production.
      # ============================================================

      - name: Verify deployed JAR checksum

        shell: powershell

        run: |

          $sourceJar = "${{ steps.build.outputs.jar_path }}"
          $productionJar = $env:PRODUCTION_JAR

          $sourceHash = (
            Get-FileHash `
              $sourceJar `
              -Algorithm SHA256
          ).Hash

          $productionHash = (
            Get-FileHash `
              $productionJar `
              -Algorithm SHA256
          ).Hash

          Write-Host ""
          Write-Host "======================================"
          Write-Host "DEPLOYMENT HASH VERIFICATION"
          Write-Host "======================================"

          Write-Host "Build SHA256:"
          Write-Host $sourceHash

          Write-Host ""
          Write-Host "Production SHA256:"
          Write-Host $productionHash

          if ($sourceHash -ne $productionHash) {

              Write-Host ""
              Write-Host "ERROR: HASH MISMATCH."

              exit 1
          }

          Write-Host ""
          Write-Host "HASH MATCH."
          Write-Host "EXACT BUILD ARTIFACT VERIFIED IN PRODUCTION."


      # ============================================================
      # 15. START SERVICE
      # ============================================================

      - name: Start Tax Backend Service

        shell: powershell

        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "STARTING TAX BACKEND"
          Write-Host "======================================"

          Start-Service `
            $env:SERVICE_NAME `
            -ErrorAction Stop

          Start-Sleep -Seconds 5

          $service = Get-Service `
            $env:SERVICE_NAME

          Write-Host ""
          Write-Host "Service status:"
          Write-Host $service.Status

          if ($service.Status -ne "Running") {

              Write-Host "ERROR: Service failed to enter Running state."

              exit 1
          }

          Write-Host "Service started."


      # ============================================================
      # 16. VERIFY NEW VERSION HEALTH
      #
      # IMPORTANT:
      # Application is running on 8081.
      # ============================================================

      - name: Verify new version health

        shell: powershell

        run: |

          $healthUrl = "http://127.0.0.1:$env:APP_PORT/actuator/health"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "NEW VERSION HEALTH CHECK"
          Write-Host "======================================"

          Write-Host "Health URL:"
          Write-Host $healthUrl

          $healthy = $false

          # 24 attempts x 5 seconds
          # Maximum wait approximately 2 minutes

          for ($i = 1; $i -le 24; $i++) {

              Write-Host ""
              Write-Host "Health check attempt $i/24..."

              try {

                  $response = Invoke-WebRequest `
                    -Uri $healthUrl `
                    -UseBasicParsing `
                    -TimeoutSec 5 `
                    -ErrorAction Stop

                  Write-Host "HTTP Status: $($response.StatusCode)"

                  Write-Host "Response:"
                  Write-Host $response.Content

                  if ($response.StatusCode -eq 200) {

                      try {

                          $health = $response.Content |
                            ConvertFrom-Json

                          Write-Host ""
                          Write-Host "Application status:"
                          Write-Host $health.status

                          if ($health.status -eq "UP") {

                              $healthy = $true

                              break
                          }

                      }
                      catch {

                          Write-Host "Health response could not be parsed."
                      }
                  }

              }
              catch {

                  Write-Host "Backend not ready yet."
                  Write-Host $_.Exception.Message
              }

              Start-Sleep -Seconds 5
          }


          # ========================================================
          # HEALTH FAILED
          # ========================================================

          if (!$healthy) {

              Write-Host ""
              Write-Host "======================================"
              Write-Host "NEW VERSION FAILED"
              Write-Host "======================================"

              Write-Host ""
              Write-Host "Service status:"

              Get-Service `
                $env:SERVICE_NAME

              Write-Host ""
              Write-Host "Java processes:"

              Get-CimInstance Win32_Process `
                -Filter "Name='java.exe'" |
                Select-Object `
                  ProcessId,
                  ParentProcessId,
                  CommandLine |
                Format-List

              Write-Host ""
              Write-Host "Port $env:APP_PORT:"

              Get-NetTCPConnection `
                -LocalPort ([int]$env:APP_PORT) `
                -ErrorAction SilentlyContinue |
                Format-Table

              Write-Host ""
              Write-Host "Production JAR information:"

              Get-Item `
                $env:PRODUCTION_JAR |
                Select-Object `
                  FullName,
                  Length,
                  CreationTime,
                  LastWriteTime

              Write-Host ""
              Write-Host "Production JAR SHA256:"

              Get-FileHash `
                $env:PRODUCTION_JAR `
                -Algorithm SHA256

              exit 1
          }


          Write-Host ""
          Write-Host "======================================"
          Write-Host "NEW VERSION IS HEALTHY"
          Write-Host "======================================"


      # ============================================================
      # 17. FINAL PRODUCTION VERIFICATION
      # ============================================================

      - name: Final production verification

        shell: powershell

        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "FINAL PRODUCTION VERIFICATION"
          Write-Host "======================================"

          $productionJar = $env:PRODUCTION_JAR

          Write-Host ""
          Write-Host "Production JAR:"

          Get-Item `
            $productionJar |
            Select-Object `
              FullName,
              Length,
              CreationTime,
              LastWriteTime

          Write-Host ""
          Write-Host "Production SHA256:"

          Get-FileHash `
            $productionJar `
            -Algorithm SHA256

          Write-Host ""
          Write-Host "Backend health:"

          curl.exe `
            -s `
            "http://127.0.0.1:$env:APP_PORT/actuator/health"

          Write-Host ""
          Write-Host ""

          Write-Host "======================================"
          Write-Host "DEPLOYMENT SUCCESSFUL"
          Write-Host "======================================"


      # ============================================================
      # 18. AUTOMATIC ROLLBACK
      #
      # Runs whenever a deployment step above fails.
      # ============================================================

      - name: Rollback production

        if: failure()

        shell: powershell

        run: |

          $productionJar = $env:PRODUCTION_JAR

          # IMPORTANT:
          # Get backup path from the BACKUP STEP OUTPUT.
          # Do NOT use $env:BACKUP_JAR.

          $backupJar = "${{ steps.backup.outputs.backup_jar }}"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "DEPLOYMENT FAILED"
          Write-Host "STARTING AUTOMATIC ROLLBACK"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Backup JAR:"
          Write-Host $backupJar


          # ========================================================
          # VERIFY BACKUP
          # ========================================================

          if ([string]::IsNullOrWhiteSpace($backupJar)) {

              Write-Host ""
              Write-Host "CRITICAL ERROR:"
              Write-Host "Backup JAR path is empty."

              Write-Host ""
              Write-Host "Automatic rollback cannot continue."

              exit 1
          }


          if (!(Test-Path $backupJar)) {

              Write-Host ""
              Write-Host "CRITICAL ERROR:"
              Write-Host "Backup JAR does not exist."

              Write-Host $backupJar

              exit 1
          }


          Write-Host ""
          Write-Host "Backup exists."


          # ========================================================
          # STOP CURRENT / FAILED VERSION
          # ========================================================

          Write-Host ""
          Write-Host "Stopping TaxBackendService..."

          try {

              Stop-Service `
                $env:SERVICE_NAME `
                -Force `
                -ErrorAction Stop

          }
          catch {

              Write-Host "Service was already stopped."
          }


          # Wait for service
          $timeout = 30
          $elapsed = 0

          do {

              Start-Sleep -Seconds 1
              $elapsed++

              $service = Get-Service `
                $env:SERVICE_NAME `
                -ErrorAction SilentlyContinue

          } while (
              $service.Status -ne "Stopped" -and
              $elapsed -lt $timeout
          )


          Start-Sleep -Seconds 3


          # ========================================================
          # RESTORE PREVIOUS JAR
          # ========================================================

          Write-Host ""
          Write-Host "Restoring previous production JAR..."

          Copy-Item `
            $backupJar `
            $productionJar `
            -Force `
            -ErrorAction Stop

          Write-Host "Previous JAR restored."


          # ========================================================
          # VERIFY ROLLBACK JAR
          # ========================================================

          $backupHash = (
            Get-FileHash `
              $backupJar `
              -Algorithm SHA256
          ).Hash

          $restoredHash = (
            Get-FileHash `
              $productionJar `
              -Algorithm SHA256
          ).Hash

          Write-Host ""
          Write-Host "Backup SHA256:"
          Write-Host $backupHash

          Write-Host ""
          Write-Host "Restored SHA256:"
          Write-Host $restoredHash

          if ($backupHash -ne $restoredHash) {

              Write-Host ""
              Write-Host "CRITICAL:"
              Write-Host "Rollback JAR hash mismatch."

              exit 1
          }

          Write-Host ""
          Write-Host "Rollback JAR verified."


          # ========================================================
          # START PREVIOUS VERSION
          # ========================================================

          Write-Host ""
          Write-Host "Starting previous version..."

          Start-Service `
            $env:SERVICE_NAME `
            -ErrorAction Stop

          Start-Sleep -Seconds 5


          # ========================================================
          # ROLLBACK HEALTH CHECK
          # ========================================================

          $healthUrl = "http://127.0.0.1:$env:APP_PORT/actuator/health"

          Write-Host ""
          Write-Host "======================================"
          Write-Host "ROLLBACK HEALTH CHECK"
          Write-Host "======================================"

          Write-Host "Health URL:"
          Write-Host $healthUrl

          $healthy = $false


          for ($i = 1; $i -le 24; $i++) {

              Write-Host ""
              Write-Host "Rollback health check $i/24..."

              try {

                  $response = Invoke-WebRequest `
                    -Uri $healthUrl `
                    -UseBasicParsing `
                    -TimeoutSec 5 `
                    -ErrorAction Stop

                  Write-Host "HTTP Status: $($response.StatusCode)"

                  Write-Host "Response:"
                  Write-Host $response.Content

                  if ($response.StatusCode -eq 200) {

                      try {

                          $health = $response.Content |
                            ConvertFrom-Json

                          Write-Host ""
                          Write-Host "Application status:"
                          Write-Host $health.status

                          if ($health.status -eq "UP") {

                              $healthy = $true

                              break
                          }

                      }
                      catch {

                          Write-Host "Could not parse health response."
                      }
                  }

              }
              catch {

                  Write-Host "Rollback version not ready."
                  Write-Host $_.Exception.Message
              }

              Start-Sleep -Seconds 5
          }


          # ========================================================
          # ROLLBACK FAILED
          # ========================================================

          if (!$healthy) {

              Write-Host ""
              Write-Host "======================================"
              Write-Host "CRITICAL: ROLLBACK FAILED"
              Write-Host "======================================"

              Write-Host ""
              Write-Host "Service:"

              Get-Service `
                $env:SERVICE_NAME

              Write-Host ""
              Write-Host "Java processes:"

              Get-CimInstance Win32_Process `
                -Filter "Name='java.exe'" |
                Select-Object `
                  ProcessId,
                  ParentProcessId,
                  CommandLine |
                Format-List

              Write-Host ""
              Write-Host "Port $env:APP_PORT:"

              Get-NetTCPConnection `
                -LocalPort ([int]$env:APP_PORT) `
                -ErrorAction SilentlyContinue |
                Format-Table

              exit 1
          }


          # ========================================================
          # ROLLBACK SUCCESSFUL
          # ========================================================

          Write-Host ""
          Write-Host "======================================"
          Write-Host "ROLLBACK SUCCESSFUL"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "Previous version is healthy."

          Write-Host ""
          Write-Host "Production has been restored."

          # Keep workflow FAILED because the NEW deployment failed.
          exit 1