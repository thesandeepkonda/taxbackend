name: Test Tax Backend Runner

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Test Runner
        shell: powershell
        run: |
          Write-Host "===================================="
          Write-Host "Tax Backend Runner Working"
          Write-Host "===================================="

          Write-Host "Computer:"
          Write-Host $env:COMPUTERNAME

          Write-Host "User:"
          Write-Host $env:USERNAME

          Write-Host "Workspace:"
          Write-Host $env:GITHUB_WORKSPACE

      - name: Check Java
        shell: powershell
        run: |
          Write-Host "Java version:"
          java -version

      - name: Check Maven Wrapper
        shell: powershell
        run: |

          $mvn = "$env:GITHUB_WORKSPACE\mvnw.cmd"

          Write-Host "Checking:"
          Write-Host $mvn

          if (Test-Path $mvn) {
              Write-Host "SUCCESS: mvnw.cmd found."
          }
          else {
              Write-Error "mvnw.cmd not found."
              exit 1
          }

      - name: Check Backend Folder
        shell: powershell
        run: |

          $path = "C:\TaxBackend\app"

          if (Test-Path $path) {
              Write-Host "Backend deployment folder exists."
          }
          else {
              New-Item `
                -ItemType Directory `
                -Path $path `
                -Force

              Write-Host "Backend deployment folder created."
          }